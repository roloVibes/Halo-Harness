<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="'Fira Code','DejaVu Sans Mono',Consolas,Menlo,monospace">
<title id="t">Routes: one session across providers</title>
<desc id="d">Five route prefixes (or, dbx, local, ant, oai) all feed one Halo session that reads the user's existing Claude Code setup.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#89b4fa"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a6e3a1"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f9e2af"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f38ba8"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94e2d5"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fab387"/></marker><marker id="ah-mauve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cba6f7"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9399b2"/></marker></defs>
<rect width="960" height="400" rx="16" fill="#1e1e2e"/>
<text x="24" y="38" font-size="22" fill="#cdd6f4" text-anchor="start" font-weight="700">One session, any route</text>
<text x="24" y="60" font-size="12" fill="#9399b2" text-anchor="start" font-weight="400">/model swaps the lane; the history, tools and rules come with you</text>
<rect x="24" y="92" width="330" height="42" rx="21.0" fill="#313244" stroke="#89b4fa" stroke-width="1.4"/>
<text x="40" y="118.0" font-size="14" fill="#89b4fa" text-anchor="start" font-weight="700">or:</text>
<text x="338" y="118.0" font-size="11" fill="#9399b2" text-anchor="end" font-weight="400">OpenRouter</text>
<line x1="354" y1="113" x2="430" y2="168" stroke="#89b4fa" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<rect x="24" y="150" width="330" height="42" rx="21.0" fill="#313244" stroke="#fab387" stroke-width="1.4"/>
<text x="40" y="176.0" font-size="14" fill="#fab387" text-anchor="start" font-weight="700">dbx:</text>
<text x="338" y="176.0" font-size="11" fill="#9399b2" text-anchor="end" font-weight="400">Databricks serving</text>
<line x1="354" y1="171" x2="430" y2="182" stroke="#fab387" stroke-width="1.8" marker-end="url(#ah-orange)"/>
<rect x="24" y="208" width="330" height="42" rx="21.0" fill="#313244" stroke="#a6e3a1" stroke-width="1.4"/>
<text x="40" y="234.0" font-size="14" fill="#a6e3a1" text-anchor="start" font-weight="700">local:</text>
<text x="338" y="234.0" font-size="11" fill="#9399b2" text-anchor="end" font-weight="400">Ollama, HF, local servers</text>
<line x1="354" y1="229" x2="430" y2="196" stroke="#a6e3a1" stroke-width="1.8" marker-end="url(#ah-green)"/>
<rect x="24" y="266" width="330" height="42" rx="21.0" fill="#313244" stroke="#cba6f7" stroke-width="1.4"/>
<text x="40" y="292.0" font-size="14" fill="#cba6f7" text-anchor="start" font-weight="700">ant:</text>
<text x="338" y="292.0" font-size="11" fill="#9399b2" text-anchor="end" font-weight="400">Anthropic API (key)</text>
<line x1="354" y1="287" x2="430" y2="210" stroke="#cba6f7" stroke-width="1.8" marker-end="url(#ah-mauve)"/>
<rect x="24" y="324" width="330" height="42" rx="21.0" fill="#313244" stroke="#f9e2af" stroke-width="1.4"/>
<text x="40" y="350.0" font-size="14" fill="#f9e2af" text-anchor="start" font-weight="700">oai:</text>
<text x="338" y="350.0" font-size="11" fill="#9399b2" text-anchor="end" font-weight="400">OpenAI API</text>
<line x1="354" y1="345" x2="430" y2="224" stroke="#f9e2af" stroke-width="1.8" marker-end="url(#ah-yellow)"/>
<rect x="430" y="150" width="250" height="160" rx="10" fill="#2a2b3d" stroke="#cba6f7" stroke-width="1.6"/>
<rect x="430" y="150" width="250" height="6" rx="3" fill="#cba6f7" opacity="0.9"/>
<text x="555.0" y="179" font-size="15" fill="#cba6f7" text-anchor="middle" font-weight="700">Halo session</text>
<text x="555.0" y="202" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">one history</text>
<text x="555.0" y="219" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">one set of tools</text>
<text x="555.0" y="236" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">one permission model</text>
<text x="555.0" y="253" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">per-model tool-call repairs</text>
<text x="555.0" y="270" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">steering, hooks, /stats</text>
<line x1="680" y1="230" x2="736" y2="230" stroke="#cba6f7" stroke-width="1.8" marker-end="url(#ah-mauve)"/>
<rect x="736" y="120" width="198" height="220" rx="10" fill="#2a2b3d" stroke="#94e2d5" stroke-width="1.6"/>
<rect x="736" y="120" width="198" height="6" rx="3" fill="#94e2d5" opacity="0.9"/>
<text x="835.0" y="149" font-size="15" fill="#94e2d5" text-anchor="middle" font-weight="700">Reused in place</text>
<text x="835.0" y="172" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">~/.claude settings</text>
<text x="835.0" y="189" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">CLAUDE.md</text>
<text x="835.0" y="206" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">skills, commands</text>
<text x="835.0" y="223" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">agents</text>
<text x="835.0" y="240" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">MCP servers</text>
<text x="835.0" y="257" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">memory</text>
<text x="835.0" y="274" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">nothing configured twice</text>
</svg>
