<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d" font-family="'Fira Code','DejaVu Sans Mono',Consolas,Menlo,monospace">
<title id="t">Roles and organizations</title>
<desc id="d">A lineup assigns a model to each role; an organization is a tree of those roles running one goal; the tasks panel shows the tree live.</desc>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#89b4fa"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a6e3a1"/></marker><marker id="ah-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f9e2af"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f38ba8"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94e2d5"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fab387"/></marker><marker id="ah-mauve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cba6f7"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9399b2"/></marker></defs>
<rect width="960" height="500" rx="16" fill="#1e1e2e"/>
<text x="24" y="38" font-size="22" fill="#cdd6f4" text-anchor="start" font-weight="700">Roles and organizations</text>
<text x="24" y="60" font-size="12" fill="#9399b2" text-anchor="start" font-weight="400">the same flow that built Halo: a lead plans, workers implement, reviewers check</text>
<rect x="24" y="92" width="280" height="300" rx="10" fill="#2a2b3d" stroke="#89b4fa" stroke-width="1.6"/>
<rect x="24" y="92" width="280" height="6" rx="3" fill="#89b4fa" opacity="0.9"/>
<text x="164.0" y="121" font-size="15" fill="#89b4fa" text-anchor="middle" font-weight="700">A lineup</text>
<text x="164.0" y="144" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">roles -&gt; models</text>
<text x="164.0" y="161" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400"></text>
<text x="164.0" y="178" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">orchestrator -&gt; demo/atlas-pro</text>
<text x="164.0" y="195" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">implementer -&gt; local coder 14b</text>
<text x="164.0" y="212" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">tester -&gt; demo/atlas-flash</text>
<text x="164.0" y="229" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">reviewer -&gt; demo/atlas-flash</text>
<text x="164.0" y="246" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">docs -&gt; demo/atlas-lite</text>
<text x="164.0" y="263" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400"></text>
<text x="164.0" y="280" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">halo teams use &lt;lineup&gt;</text>
<rect x="340" y="92" width="280" height="300" rx="10" fill="#2a2b3d" stroke="#cba6f7" stroke-width="1.6"/>
<rect x="340" y="92" width="280" height="6" rx="3" fill="#cba6f7" opacity="0.9"/>
<text x="480.0" y="121" font-size="15" fill="#cba6f7" text-anchor="middle" font-weight="700">An organization</text>
<text x="480.0" y="144" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">one goal, one tree</text>
<text x="480.0" y="161" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400"></text>
<text x="480.0" y="178" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400"></text>
<text x="480.0" y="195" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400"></text>
<text x="480.0" y="212" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400"></text>
<text x="480.0" y="229" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400"></text>
<text x="480.0" y="246" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400"></text>
<text x="480.0" y="263" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400"></text>
<text x="480.0" y="280" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400"></text>
<rect x="400" y="160" width="160" height="34" rx="17.0" fill="#313244" stroke="#cba6f7" stroke-width="1.4"/>
<text x="416" y="182.0" font-size="13" fill="#cba6f7" text-anchor="start" font-weight="700">Lead</text>
<line x1="480" y1="194" x2="394" y2="238" stroke="#9399b2" stroke-width="1.8" marker-end="url(#ah-muted)"/>
<rect x="356" y="238" width="86" height="30" rx="15.0" fill="#313244" stroke="#89b4fa" stroke-width="1.4"/>
<text x="399.0" y="257.0" font-size="11" fill="#89b4fa" text-anchor="middle" font-weight="700">Planner</text>
<line x1="480" y1="194" x2="480" y2="238" stroke="#9399b2" stroke-width="1.8" marker-end="url(#ah-muted)"/>
<rect x="442" y="238" width="86" height="30" rx="15.0" fill="#313244" stroke="#a6e3a1" stroke-width="1.4"/>
<text x="485.0" y="257.0" font-size="11" fill="#a6e3a1" text-anchor="middle" font-weight="700">Implementer</text>
<line x1="480" y1="194" x2="566" y2="238" stroke="#9399b2" stroke-width="1.8" marker-end="url(#ah-muted)"/>
<rect x="528" y="238" width="86" height="30" rx="15.0" fill="#313244" stroke="#fab387" stroke-width="1.4"/>
<text x="571.0" y="257.0" font-size="11" fill="#fab387" text-anchor="middle" font-weight="700">Reviewer</text>
<line x1="442" y1="268" x2="442" y2="300" stroke="#9399b2" stroke-width="1.8" marker-end="url(#ah-muted)"/>
<rect x="399" y="300" width="86" height="30" rx="15.0" fill="#313244" stroke="#94e2d5" stroke-width="1.4"/>
<text x="442.0" y="319.0" font-size="11" fill="#94e2d5" text-anchor="middle" font-weight="700">Tester</text>
<line x1="640" y1="242" x2="656" y2="242" stroke="#9399b2" stroke-width="1.8" marker-end="url(#ah-muted)"/>
<rect x="656" y="92" width="278" height="300" rx="10" fill="#2a2b3d" stroke="#a6e3a1" stroke-width="1.6"/>
<rect x="656" y="92" width="278" height="6" rx="3" fill="#a6e3a1" opacity="0.9"/>
<text x="795.0" y="121" font-size="15" fill="#a6e3a1" text-anchor="middle" font-weight="700">/tasks</text>
<text x="795.0" y="144" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">live, one row per agent</text>
<text x="795.0" y="161" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400"></text>
<text x="795.0" y="178" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">Lead: running</text>
<text x="795.0" y="195" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">Planner: done</text>
<text x="795.0" y="212" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">Implementer: running</text>
<text x="795.0" y="229" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">Tester: running</text>
<text x="795.0" y="246" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">Reviewer: queued</text>
<text x="795.0" y="263" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">Enter opens a transcript</text>
<text x="795.0" y="280" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">Tab: the task board</text>
<rect x="24" y="416" width="910" height="62" rx="10" fill="none" stroke="#9399b2" stroke-width="1.4" stroke-dasharray="3 5"/>
<text x="479.0" y="440" font-size="12" fill="#9399b2" text-anchor="middle" font-weight="700">each role runs as a sub-agent on its own model</text>
<text x="479.0" y="458" font-size="12" fill="#cdd6f4" text-anchor="middle" font-weight="400">queued, running, background and finished agents all stay visible; cost is attributed per role</text>
</svg>
