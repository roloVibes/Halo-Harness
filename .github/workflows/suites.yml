# Halo Harness 2.0.4 round 0 (tooling): runs the three hermetic suites
# (test_bridge.py, tests/run_all.py, test_tui.py) on every push to master
# and every pull request, on Linux and Windows, the same way the
# orchestrator has been running them by hand. No secrets, no provider
# keys -- every test scopes its own state under BRIDGE_TEST_HOME, and
# BRIDGE_TEST_NO_BACKGROUND_NET=1 keeps every background catalog/balance
# worker from touching the network. This workflow is the only place that
# installs anything from the network: every package comes from a hash-locked
# file (requirements.lock for the runtime, requirements-ci.lock for the CI
# tools), and the actions are pinned to full commit SHAs.
name: suites

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

on:
  push:
    branches: [master]
    # Planning-only commits never change code or docs under test: no run, no
    # failure e-mail for a stale flake on a plans commit.
    paths-ignore:
      - 'plans/**'
  pull_request:
    paths-ignore:
      - 'plans/**'

concurrency:
  group: suites-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: suites (linux, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      BRIDGE_TEST_NO_BACKGROUND_NET: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings on checkout
        run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # 2.0.10 review finding 27: the dependencies come from the hashed lock
      # first (pip refuses any file whose hash differs), then this repo.
      - name: Install pinned dependencies (requirements.lock, hashes enforced)
        run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install --require-hashes --no-deps -r requirements-ci.lock

      # No dependency resolution and no build isolation: the build backend
      # (setuptools) comes from requirements-ci.lock above.
      - name: Install halo-harness (editable)
        run: pip install --no-deps --no-build-isolation -e .

      # Fails on a known CVE in any pinned dependency; accepted ids live in
      # .github/pip-audit-allowlist.txt, each with its reason.
      - name: pip-audit (requirements.lock)
        run: python scripts/pip_audit_gate.py

      - name: Fresh test home
        run: |
          mkdir -p "$RUNNER_TEMP/halo-test-home"
          echo "BRIDGE_TEST_HOME=$RUNNER_TEMP/halo-test-home" >> "$GITHUB_ENV"

      # vibes/review.md findings 24/25/79's follow-up (the review's own
      # suggested order, item 2): a pyflakes undefined-names gate before
      # the suites -- every crash-class finding this pass fixed
      # (model_ref/is_error/resolve_settings/UpstreamResult/Callable) was
      # a latent undefined name CI would have caught. Only "undefined
      # name" output FAILS: unused-import/redefinition notes exist in
      # older modules and are being burned down separately.
      - name: pyflakes (undefined names gate)
        run: |
          python - <<'EOF'
          import subprocess, sys
          proc = subprocess.run([sys.executable, "-m", "pyflakes", "halo_harness/", "bridge.py"],
                                capture_output=True, text=True)
          undefined = [ln for ln in proc.stdout.splitlines() if "undefined name" in ln]
          for ln in undefined:
              print(ln)
          if undefined:
              sys.exit(1)
          print(f"pyflakes: no undefined names ({len(proc.stdout.splitlines())} other notes)")
          EOF

      # Each suite is its own step so one hanging/failing suite never hides
      # the other two: continue-on-error keeps the job going, timeout-
      # minutes bounds each suite individually (inside the job's own hard
      # cap above), and `set -o pipefail` makes sure python's real exit
      # code (not tee's) is what the step actually fails on.
      - name: test_bridge.py
        id: bridge
        continue-on-error: true
        timeout-minutes: 15
        run: set -o pipefail; python test_bridge.py 2>&1 | tee "$RUNNER_TEMP/bridge.log"

      - name: tests/run_all.py
        id: run_all
        continue-on-error: true
        timeout-minutes: 50
        run: set -o pipefail; python tests/run_all.py 2>&1 | tee "$RUNNER_TEMP/run_all.log"

      - name: test_tui.py
        id: tui
        continue-on-error: true
        timeout-minutes: 15
        run: set -o pipefail; python test_tui.py 2>&1 | tee "$RUNNER_TEMP/tui.log"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### suites (linux, py3.12)"
            echo
            for entry in "test_bridge.py bridge ${{ steps.bridge.outcome }}" \
                         "tests/run_all.py run_all ${{ steps.run_all.outcome }}" \
                         "test_tui.py tui ${{ steps.tui.outcome }}"; do
              set -- $entry
              name="$1"; key="$2"; outcome="$3"
              line=$(grep -E '^RESULT:|^exit=' "$RUNNER_TEMP/${key}.log" 2>/dev/null | tail -2 | tr '\n' ' ')
              mark="PASS"; [ "$outcome" = "success" ] || mark="FAIL"
              echo "- **$mark** \`$name\` -- ${line:-no RESULT line captured}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: steps.bridge.outcome != 'success' || steps.run_all.outcome != 'success' || steps.tui.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: suite-logs-linux
          path: |
            ${{ runner.temp }}/bridge.log
            ${{ runner.temp }}/run_all.log
            ${{ runner.temp }}/tui.log

      - name: Fail the job if any suite failed
        if: always()
        run: |
          if [ "${{ steps.bridge.outcome }}" != "success" ] || [ "${{ steps.run_all.outcome }}" != "success" ] || [ "${{ steps.tui.outcome }}" != "success" ]; then
            echo "one or more suites did not pass -- see the job summary and (on failure) the uploaded logs"
            exit 1
          fi

  windows:
    name: suites (windows, py3.12)
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      PYTHONPATH: ${{ github.workspace }}
      BRIDGE_TEST_NO_BACKGROUND_NET: "1"
      # The TUI suite renders real Unicode (box-drawing, theme glyphs) and
      # a failing assertion can embed any of it in its message -- PYTHONUTF8
      # keeps that from ever crashing the runner with a UnicodeEncodeError
      # instead of reporting the failure. COLUMNS/LINES give Textual's
      # headless test driver a generous, explicit virtual terminal size
      # instead of whatever default a non-interactive Windows runner shell
      # would otherwise report.
      PYTHONUTF8: "1"
      COLUMNS: "200"
      LINES: "50"
      # The hosted Windows image's TEMP is an 8.3 short-name path under the
      # runner user's profile; Halo resolves paths to their long form, so
      # tests comparing a scratch path with a resolved one failed on the
      # first run for that reason alone. The runner temp is a plain long path.
      # (TEMP/TMP are set in the 'Fresh test home' step: the runner context
      # is not available to a job-level env block.)
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings on checkout
        run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # 2.0.10 review finding 27: the dependencies come from the hashed lock
      # first (pip refuses any file whose hash differs), then this repo.
      - name: Install pinned dependencies (requirements.lock, hashes enforced)
        run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install --require-hashes --no-deps -r requirements-ci.lock

      # No dependency resolution and no build isolation: the build backend
      # (setuptools) comes from requirements-ci.lock above.
      - name: Install halo-harness (editable)
        run: pip install --no-deps --no-build-isolation -e .

      # Fails on a known CVE in any pinned dependency; accepted ids live in
      # .github/pip-audit-allowlist.txt, each with its reason.
      - name: pip-audit (requirements.lock)
        run: python scripts/pip_audit_gate.py

      - name: Fresh test home
        run: |
          mkdir -p "$RUNNER_TEMP/halo-test-home"
          echo "BRIDGE_TEST_HOME=$RUNNER_TEMP/halo-test-home" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: test_bridge.py
        id: bridge
        continue-on-error: true
        timeout-minutes: 20
        run: set -o pipefail; python test_bridge.py 2>&1 | tee "$RUNNER_TEMP/bridge.log"

      - name: tests/run_all.py
        id: run_all
        continue-on-error: true
        timeout-minutes: 65
        run: set -o pipefail; python tests/run_all.py 2>&1 | tee "$RUNNER_TEMP/run_all.log"

      - name: test_tui.py
        id: tui
        continue-on-error: true
        timeout-minutes: 20
        run: set -o pipefail; python test_tui.py 2>&1 | tee "$RUNNER_TEMP/tui.log"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### suites (windows, py3.12)"
            echo
            for entry in "test_bridge.py bridge ${{ steps.bridge.outcome }}" \
                         "tests/run_all.py run_all ${{ steps.run_all.outcome }}" \
                         "test_tui.py tui ${{ steps.tui.outcome }}"; do
              set -- $entry
              name="$1"; key="$2"; outcome="$3"
              line=$(grep -E '^RESULT:|^exit=' "$RUNNER_TEMP/${key}.log" 2>/dev/null | tail -2 | tr '\n' ' ')
              mark="PASS"; [ "$outcome" = "success" ] || mark="FAIL"
              echo "- **$mark** \`$name\` -- ${line:-no RESULT line captured}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: steps.bridge.outcome != 'success' || steps.run_all.outcome != 'success' || steps.tui.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: suite-logs-windows
          path: |
            ${{ runner.temp }}/bridge.log
            ${{ runner.temp }}/run_all.log
            ${{ runner.temp }}/tui.log

      - name: Fail the job if any suite failed
        if: always()
        run: |
          if [ "${{ steps.bridge.outcome }}" != "success" ] || [ "${{ steps.run_all.outcome }}" != "success" ] || [ "${{ steps.tui.outcome }}" != "success" ]; then
            echo "one or more suites did not pass -- see the job summary and (on failure) the uploaded logs"
            exit 1
          fi

  # 3.0.3.0: Halo Studio's React shell (halo_harness/studio/ui). The built
  # bundle is committed under halo_harness/studio/static/dist so an install
  # needs no node; this job rebuilds it from the lockfile and fails when the
  # committed dist differs (run `npm run build` in halo_harness/studio/ui and
  # commit the result). The Python jobs above stay node-free.
  studio-ui:
    name: studio-ui (build + drift gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      BRIDGE_TEST_NO_BACKGROUND_NET: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings on checkout
        run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: npm ci (package-lock.json)
        working-directory: halo_harness/studio/ui
        run: npm ci --no-audit --no-fund

      - name: npm run build
        working-directory: halo_harness/studio/ui
        run: npm run build

      - name: The committed dist matches the build
        run: |
          git diff --exit-code -- halo_harness/studio/static/dist
          # a new or removed chunk shows as untracked / deleted, which git diff alone misses
          test -z "$(git status --porcelain -- halo_harness/studio/static/dist)" || { git status --short -- halo_harness/studio/static/dist; exit 1; }

      - name: Install pinned dependencies (requirements.lock, hashes enforced)
        run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install --require-hashes --no-deps -r requirements-ci.lock

      - name: Fresh test home
        run: |
          mkdir -p "$RUNNER_TEMP/halo-test-home"
          echo "BRIDGE_TEST_HOME=$RUNNER_TEMP/halo-test-home" >> "$GITHUB_ENV"

      - name: tests/test_studio_dist.py
        run: python tests/test_studio_dist.py
