# A fixture pack for tests/test_packs_contrib_wired.py (Halo 3.4.0.0 B2): one doctor row and two settings rows.
id: contrib-rows
name: Contrib rows
version: 1.0.0
description: Two Settings rows and one doctor row, for the tests of contributes.settings and contributes.doctor.
halo_api: {min: "1.3", max: "1.9"}
contributes:
  doctor:
    - {id: rows, module: doctor.py, help: "says the level it reads"}
  settings:
    - {key: level, title: Level, type: integer, default: 2, help: "How loud the fixture is."}
    - {key: name, title: Name, type: string, default: "", help: "A name the fixture says."}
permissions: [doctor]
