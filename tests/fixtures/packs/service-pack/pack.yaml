# A test pack (3.3.13.0 R3, tests/test_supervise_services.py): one service the supervisor keeps running and an entry
# command that runs a program of the pack (`run:`), both service/ticker.py.
id: service-pack
name: Service pack
version: 1.0.0
description: a ticker service that rewrites its health file, and a command that runs a program
author: Halo fixtures
license: MIT
halo_api: {min: "1.2", max: "1.9"}
contributes:
  commands: commands
  services:
    - name: ticker
      description: rewrites its health file twice a second
      run: ["${halo_python}", "${CLAUDE_PLUGIN_ROOT}/service/ticker.py"]
      autostart: true
      restart: on-failure
      health: {file: ticker.json, max_age_s: 5}
      log: ticker.log
permissions: [services, bash]  # 3.3.14.0 R1: the `run:` command needs bash
