name: reviewer
description: Reads a document and lists what is unclear, wrong or missing, one finding per line.
version: 1
tags: [docs, review]
kind: reviewer
models:
  capabilities: [long-context]
  effort: high
tools:
  allow: [Read, Grep, Glob, Bash]
  deny: [Edit, Write]
  needs: [bash]
context:
  memory: {namespace: reviews}
output:
  handoff: summary
