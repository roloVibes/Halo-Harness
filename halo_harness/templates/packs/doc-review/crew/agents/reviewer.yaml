# The doc-review pack's reviewer (extension API 2.0: agent/1, read in place as doc-review--reviewer).
format: agent/1
name: reviewer
does: Reads a document and lists what is unclear, wrong or missing, one finding per line.
instructions: |-
  Read the documents the task names. List what is unclear, wrong or missing, one finding per line, each with its
  file and line number. Change nothing.
model: auto
needs: [long-text]
uses: [read, bash]
careful: ask-changes
more: {effort: high}
