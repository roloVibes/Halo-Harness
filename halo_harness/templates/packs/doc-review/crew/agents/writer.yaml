# The doc-review pack's writer (extension API 2.0: agent/1, read in place as doc-review--writer).
format: agent/1
name: writer
does: Rewrites a section from the reviewer's findings, in plain language.
instructions: |-
  Rewrite the sections the findings name, in plain language, and say what you changed, one line per file.
model: auto
uses: [read, edit]
careful: ask-changes
more: {effort: medium}
