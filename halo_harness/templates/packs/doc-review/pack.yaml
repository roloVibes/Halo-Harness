# Documentation Review: the reference pack Halo ships (3.2.0.0 R6). Copy this
# folder to make your own pack; README.md beside this file explains every file.
# `halo pack install doc-review` installs it (disabled), `halo pack enable
# doc-review --grant bash` turns it on, `halo pack doctor` checks it.
#
# What it shows, one part of the extension API each (docs/EXTENSION_API.md):
# - a reviewer and a writer bio (agents/) and the review lineup (teams/), read in
#   place as doc-review--reviewer, doc-review--writer and doc-review--review;
# - the review workflow (workflows/review.yaml): read every Markdown file, judge
#   the findings, write one typed review-report (artifacts/review-report.json);
# - a Studio section (contributes.studio): the notes, the checks, the links, the
#   last review report, a Reviews panel in Session, a palette action, the
#   settings form, a line for review.done and an attention row kind;
# - the docs.review fleet capability (contributes.fleet): a harness offers it with
#   the bash grant and a model that calls tools;
# - the Claude-plugin half: a skill, a command, a hook and a lint MCP server, each
#   running only once you grant what it needs (permissions).
id: doc-review
name: Documentation Review
version: 1.0.0
description: Reviews a repo's Markdown documents with a reviewer and a writer bio, a review workflow and a typed review report.
author: Halo Harness
license: MIT
halo_api: {min: "1.0", max: "1.9"}
halo: {min: "3.1"}
capabilities: [docs.review]
contributes:
  agents: [agents/reviewer.yaml, agents/writer.yaml, agents/helper.md]
  teams: [teams/review.yaml]
  skills: skills
  commands: commands
  hooks: hooks/hooks.json
  mcp:
    - {name: lint, description: checks a document's links and headings}
  events: [review.done]
  workflows: [review]
  artifacts: [review-report]
  studio:
    sections:
      - id: docs
        title: Docs review
        blurb: The review notes, the checks and the links
        help: What the reviewer found, the checks it ran and where to read more.
        panels:
          - id: notes
            title: Review notes
            kind: markdown
            source: studio/notes.md
            w: 12
            h: 30
            help: |-
              The reviewer's notes for this repo, as the pack ships them.
              Edit studio/notes.md in the pack's folder to change them.
          - id: checks
            title: Checks
            kind: table
            source: studio/checks.json
            columns: [check, state, note]
            w: 12
            h: 30
            help: One row per check the review runs, with its last state.
          - id: links
            title: Links
            kind: links
            w: 24
            h: 16
            help: Where to read more, and the Studio sections the review uses.
            links:
              - {label: Roles (the review lineup), route: roles}
              - {label: The checks, route: docs/checks}
              - {label: How packs work, url: "https://github.com/roloVibes/Halo-Harness/blob/master/docs/PACKS.md"}
          - id: report
            title: Last review report
            kind: artifact
            schema: review-report
            source: latest
            w: 24
            h: 24
            help: |-
              The newest review report a run of the review workflow wrote in this repo,
              drawn by its schema (artifacts/review-report.json): one row per finding.
    panels:
      - id: reviews
        section: session
        title: Reviews
        kind: events
        w: 10
        h: 24
        help: Each review.done the pack publishes, newest last.
    palette:
      - {id: open-checks, label: Open the review checks, action: "route:docs/checks"}
    config_form: true
    events:
      review.done: {label: REVIEW, line: "{file}: {findings} findings"}
    attention:
      review.ask: {label: review, keys: {a: accept, r: redo, s: skip, o: open}}
  fleet:
    capabilities:
      - name: docs.review
        description: Reviews a repo's documents for dead links, heading order and style
        requires:
          models: [tools]
          grants: [bash]
        capacity: {parallel: 2}
    inspector:
      - {label: Review checklist, source: fleet/checklist.md}
    mission:
      metadata: {review: docs, style: short}
config:
  schema:
    properties:
      style: {type: string, enum: [short, long], description: How long the reviewer's notes are}
      max_findings: {type: integer, description: The most findings one review lists}
    additionalProperties: false
  defaults: {style: short, max_findings: 20}
permissions: ["mcp:lint", hooks, bash]
migrations:
  - {from: 0.9.0, to: 1.0.0, note: the reviewer bio is now doc-review--reviewer}
