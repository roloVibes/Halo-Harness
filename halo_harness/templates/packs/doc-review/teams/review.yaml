name: review
description: The writer leads; the reviewer reads every change before it lands.
version: "1.0"
tags: [docs]
agents:
  - {agent: writer, role: main}
  - {agent: reviewer, role: reviewer}
delegation: {mode: manual, max_parallel: 1}
tiers:
  - {name: lead, members: [main]}
  - {name: checks, members: [reviewer]}
acceptance:
  review: true
  test: python -m pytest -q
workflows: [review]
permissions:
  mode: auto
  rules:
    allow: ["Bash(git diff*)"]
    deny: ["Bash(git push*)"]
