# The fleet pack (Halo 3.4.0.0 C): several halos joined to one hub, out of Halo's core. `halo fleet ...` and
# `halo mission ...` are its CLI verbs and `/fleet`, `/mission` its slash commands (contributes.cli / .slash); Studio's
# fleet routes (the hub, members, pairing, health, the digest, capabilities, missions, recall across the fleet) come
# from server/fleet_hub_api.py through the core's door (halo_harness/packs/fleet_door.py), and Studio shows its Fleet
# doors (the Fleet fold in Agents, the Fleet Tree panel, Setup's Machines hub rows) only while this pack runs.
# Its Python reaches the core (peers/, live/, the session's sockets) through `halo_harness.ext.core`.
id: fleet
name: Fleet
version: 1.0.4
description: >-
  Several halos joined to one hub: `halo studio --fleet` or `halo fleet serve` runs the hub, `halo fleet join` pairs
  another machine with a six-word code, and the hub sees every member's sessions and agents, steers them as each
  owner allows, runs missions split across machines by what each can do, relays recall and knowledge, and keeps the
  digest, health and the capability catalog. Part of Halo's core until 3.4.0.0. Local hosts (`halo host serve`, the
  pool, Local -> Hosts) are the core's and work without it.
author: Halo Harness
license: MIT
halo_api: {min: "1.2", max: "1.9"}
capabilities: [fleet.hub, fleet.missions]
contributes:
  cli:
    - {verb: fleet, module: cli/fleet.py, help: "the fleet: the hub, pairing, join, members, the live table, missions, capabilities"}
    - {verb: mission, module: cli/mission.py, help: "fleet missions: one goal split across every halo (halo fleet mission ...)"}
  slash:
    - {name: fleet, module: cli/slash_fleet.py, help: "the fleet: every harness, session and agent this machine sees; who / capabilities"}
    - {name: mission, module: cli/slash_mission.py, help: "fleet missions: the list, or one mission's parts by harness"}
  doctor:  # 3.4.0.1: whether it runs, the hub here and the firewall in its way, the hubs this harness joined
    - {id: fleet, module: doctor.py, help: "the hub here (and Windows Firewall), the hubs this harness joined"}
permissions: ["cli:fleet", "cli:mission", doctor]
