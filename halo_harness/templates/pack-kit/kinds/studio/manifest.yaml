# 3.6.0.0 R0a (extension API 1.5): each panel says how it opens on Studio's stage -- role main (the section's main thing),
# drawer (beside it, its button in the view bar; side left / right, content_w its width in px, 360-560) or tab (shown in
# the main thing's place). A pack written for 1.4 or older names w / h instead; Studio maps them (w x 60 px, a right drawer).
contributes:
  studio:
    sections:
      - id: home
        title: __NAME__
        blurb: The pack's notes, its rows and its own panel
        help: What the pack shows in Studio. Each panel's ? says where its data comes from.
        panels:
          - id: notes
            title: Notes
            kind: markdown
            source: studio/notes.md
            role: main
            help: The pack's notes, from studio/notes.md in its folder.
          - id: rows
            title: Rows
            kind: table
            source: data:rows.json
            columns: [item, state, note]
            role: drawer
            side: right
            content_w: 480
            help: |-
              rows.json in the pack's data folder (~/.halo/packs/.data/__ID__/), a list of rows the pack's code writes
              with ext.write_private("__ID__", "rows.json", ...). Empty until it does.
          - id: view
            title: The pack's own panel
            kind: bundle
            source: studio/view.js
            role: tab
            help: studio/view.js draws this panel; it runs once the owner grants studio-script.
      - id: page
        title: __NAME__ page
        blurb: A whole page the pack draws itself
        help: |-
          studio/page.js draws this section's whole page with Studio's own React and parts (api.lib), and asks the
          pack's own routes (server/routes.py, under /api/packs/__ID__/__ID__/) for its data. It runs once the owner
          grants studio-script and studio-routes.
        view: {bundle: studio/page.js}
    routes: {module: server/routes.py, prefix: __ID__}
    palette:
      - {id: open-notes, label: "__NAME__: open the notes", action: "route:home/notes"}
      - {id: open-page, label: "__NAME__: open its page", action: "route:page"}
permissions: [studio-script, studio-routes]
