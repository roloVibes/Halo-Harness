# Halo 3.0.4.0 -- the social-post flow: a brief goes through a planner and a
# researcher, the marketing org plans the campaign (its Art Director's image
# prompt is held for approval), ComfyUI renders the hero image into the
# design project, a person confirms it, and the posts are written as a dry
# run (set `live: true` on the publish step to post through the Postiz CLI);
# the metrics step samples live posts' analytics. See docs/FLOWS.md.
# `halo flow new social-post --project <slug>` copies this file to
# ~/.halo/flows/social-post.flow.yaml; `halo flow run social-post` runs it.
name: social-post
version: 1
project: "{{intake.project}}"        # ~/.halo/design/<slug>/ = the artifact store
budget_usd: 6.00                      # the whole run; a step may cap lower
steps:
  - id: intake
    kind: intake
    form: {brief: text, platforms: [youtube, instagram, x, tiktok], assets: files, budget_usd: number}
  - id: plan
    kind: roles
    uses: lineup:standard
    roles: [planner, researcher]
    inputs: {brief: "$.intake.brief"}
    budget_usd: 0.50
  - id: marketing
    kind: org
    uses: org:marketing
    inputs: {goal: "$.plan.text", platforms: "$.intake.platforms", assets: "$.intake.assets"}
    budget_usd: 3.00
  - id: render
    kind: render
    uses: "comfy:text-to-image-qwen"       # a starter, a saved workflow name, or a file
    set: {prompt: "$.marketing.positions['Art Director'].prompt", width: 1080, height: 1350, seed: random}
    outputs: {kind: image, artboard: "hero"}
  - id: approve
    kind: confirm
    gate: human
    on_fail: redo:render
  - id: publish
    kind: post
    uses: postiz
    live: false                       # true posts through the postiz CLI (halo postiz doctor)
    inputs: {text: "$.marketing.positions.Copywriter.text", media: "$.approve.accepted", platforms: "$.intake.platforms"}
  - id: measure
    kind: metrics
    uses: postiz
    every: 6h                         # halo flow run --watch samples this often
    days: 7                           # ... for this many days after the first post
  - id: done
    kind: done
