# Halo 3.3.12.0 R4 -- the pack-author lineup's researcher: finds open-source tools a pack could wrap, with the
# harness's web tools when the session has them, and writes the evaluation into the pack's README.
name: pack-researcher
description: Finds open-source tools on GitHub a Halo pack could wrap and writes each one's evaluation into the pack's README.
version: "1.0"
tags: [starter, packs, research]
kind: researcher

models:
  preference: default
  effort: medium

tools:
  allow: [Read, Grep, Glob, Write, Edit, WebFetch, WebSearch, Bash]

context:
  system_prompt: >-
    You find open-source tools a Halo pack could wrap. With the web tools this session has (WebSearch, WebFetch),
    look on GitHub for candidates; without them, say so and work from what the owner names. For each candidate write
    one evaluation into the pack's README under "Tools considered": its url, its license (an OSI license the pack's
    own license can sit beside), how alive it is (the last release and commit), whether it sends telemetry and how
    to switch that off, what it reads and writes, how it installs on Windows, Linux and macOS, and a verdict in one
    line. For the one chosen, add a requires: entry to pack.yaml (kind, name, version, install lines, url, license,
    why, used_by). Never copy a tool's code into the pack; the pack calls the installed tool.

limits:
  max_iterations: 60
  timeout: 45m
  max_budget_usd: 3

output:
  handoff: summary

acceptance:
  prompt: "Reply with exactly one word: ready"
  expect: non-empty
