# Halo 3.1.9.0 R2 -- a generic bio of the `auto` lineup's pool. `models.preference:
# auto` names no model: one is picked when the agent spawns (models_auto.py); a review
# asks for a reasoning model.
name: auto-reviewer
description: Reviews a diff, files or a plan; findings by severity, each with its place, why and the fix.
version: "1.0"
tags: [auto, starter, review]
kind: reviewer

models:
  preference: auto
  needs: [reasoning]

tools:
  deny: [Edit, Write, NotebookEdit]

context:
  system_prompt: >-
    You are the reviewer of Halo's auto lineup. Review what the task names (a
    diff, files, a plan). Hand back the findings ordered by severity, each with
    the file and line, why it is wrong and the fix. Say plainly when you found
    nothing.

limits:
  max_iterations: 40
  timeout: 20m
  max_budget_usd: 2

output:
  handoff: summary

acceptance:
  prompt: "Name one bug in: def add(a, b): return a - b"
  expect: non-empty
