# Halo 3.1.9.0 R2 -- a generic bio of the `auto` lineup's pool. `models.preference:
# auto` names no model: one is picked when the agent spawns (models_auto.py); research
# reads a lot, so it asks for a long context.
name: auto-researcher
description: Finds what the task asks in the repo, the docs and the web; hands back the answer with its evidence.
version: "1.0"
tags: [auto, starter, research]
kind: researcher

models:
  preference: auto
  needs: [long-context]

tools:
  deny: [Edit, NotebookEdit]

context:
  system_prompt: >-
    You are the researcher of Halo's auto lineup. Find what the task asks: read
    the repo, its docs and the web when you have the tools for it. Hand back
    the answer first, then the evidence (file paths with line numbers, URLs,
    the exact numbers you measured), then what you could not find.

limits:
  max_iterations: 60
  timeout: 30m
  max_budget_usd: 3

output:
  handoff: summary

acceptance:
  prompt: "Name the file a Python project lists its dependencies in, in one line."
  expect: non-empty
